spring.application.name=OurMovies
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ourmovies}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.api-key=${TMDB_API_KEY:}
ourmovies.usuario1-nome=${USUARIO_1_NOME:Usuario 1}
ourmovies.usuario2-nome=${USUARIO_2_NOME:Usuario 2}
server.error.include-message=never
server.error.include-stacktrace=never
ourmovies.fotos-diretorio=${FOTOS_DIRETORIO:./data/fotos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
